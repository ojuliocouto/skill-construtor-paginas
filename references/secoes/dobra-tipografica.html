<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primeira dobra tipográfica</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.55 system-ui,-apple-system,sans-serif;color:#1f2a2e;background:#fbfaf8}
section{padding:72px 6vw}h1,h2,h3{font-family:Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 16px;text-wrap:balance}
h1{font-size:clamp(36px,5vw,64px)}h2{font-size:clamp(28px,3.4vw,44px)}h3{font-size:22px}p{margin:0 0 14px;max-width:60ch;text-wrap:pretty}
.foto{background:linear-gradient(160deg,#c9d3cf,#9fb1aa);border-radius:4px;display:flex;align-items:flex-end;padding:14px;color:#24342f;font-size:14px;min-height:260px}
.botao{display:inline-block;background:#2f5d50;color:#fff;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:600}
.botao.claro{background:#fff;color:#2f5d50}.suave{color:#55646a}
@media (max-width:767px){section{padding:48px 20px}.grade,.split,.duas{grid-template-columns:1fr!important}}</style>
</head>
<body>
<section style="min-height:600px;display:grid;grid-template-columns:2fr 1fr;gap:40px;align-items:end" class="grade">
  <div>
    <h1 style="font-size:clamp(44px,7vw,96px)">Menos dor nas costas começa com uma aula bem acompanhada</h1>
    <p class="suave">Pilates com fisioterapeuta, em turmas de até 4 pessoas.</p>
    <a class="botao" href="#oferta">Ver como funciona</a>
  </div>
  <svg viewBox="0 0 200 200" data-desenho="pessoa alongando a coluna" aria-hidden="true"><circle cx="100" cy="40" r="18" fill="none" stroke="#2f5d50" stroke-width="4"/><path d="M100 58 C96 100 104 120 100 160 M100 90 L60 70 M100 90 L140 70 M100 160 L75 195 M100 160 L125 195" fill="none" stroke="#2f5d50" stroke-width="4" stroke-linecap="round"/></svg>
</section>
</body>
</html>
