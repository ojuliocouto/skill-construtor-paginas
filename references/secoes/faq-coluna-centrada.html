<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perguntas em coluna centrada</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.55 system-ui,-apple-system,sans-serif;color:#1f2a2e;background:#fbfaf8}
section{padding:72px 6vw}h1,h2,h3{font-family:Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 16px;text-wrap:balance}
h1{font-size:clamp(36px,5vw,64px)}h2{font-size:clamp(28px,3.4vw,44px)}h3{font-size:22px}p{margin:0 0 14px;max-width:60ch;text-wrap:pretty}
.foto{background:linear-gradient(160deg,#c9d3cf,#9fb1aa);border-radius:4px;display:flex;align-items:flex-end;padding:14px;color:#24342f;font-size:14px;min-height:260px}
.botao{display:inline-block;background:#2f5d50;color:#fff;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:600}
.botao.claro{background:#fff;color:#2f5d50}.suave{color:#55646a}
@media (max-width:767px){section{padding:48px 20px}.grade,.split,.duas{grid-template-columns:1fr!important}}</style>
</head>
<body>
<section>
  <h2 style="text-align:center">Dúvidas antes da primeira aula</h2>
  <div style="max-width:720px;margin:28px auto 0;display:grid;gap:12px">
    <details style="background:#fff;border:1px solid #dde3e0;border-radius:6px;padding:18px" open><summary><strong>Preciso ter feito pilates antes?</strong></summary><p style="margin-top:10px">Não. A aula começa do seu nível.</p></details>
    <details style="background:#fff;border:1px solid #dde3e0;border-radius:6px;padding:18px"><summary><strong>Posso fazer com dor nas costas?</strong></summary><p style="margin-top:10px">A fisioterapeuta avalia antes de começar.</p></details>
    <details style="background:#fff;border:1px solid #dde3e0;border-radius:6px;padding:18px"><summary><strong>Que roupa eu levo?</strong></summary><p style="margin-top:10px">Roupa confortável e meia.</p></details>
  </div>
</section>
</body>
</html>
