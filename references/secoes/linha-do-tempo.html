<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linha do tempo</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.55 system-ui,-apple-system,sans-serif;color:#1f2a2e;background:#fbfaf8}
section{padding:72px 6vw}h1,h2,h3{font-family:Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 16px;text-wrap:balance}
h1{font-size:clamp(36px,5vw,64px)}h2{font-size:clamp(28px,3.4vw,44px)}h3{font-size:22px}p{margin:0 0 14px;max-width:60ch;text-wrap:pretty}
.foto{background:linear-gradient(160deg,#c9d3cf,#9fb1aa);border-radius:4px;display:flex;align-items:flex-end;padding:14px;color:#24342f;font-size:14px;min-height:260px}
.botao{display:inline-block;background:#2f5d50;color:#fff;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:600}
.botao.claro{background:#fff;color:#2f5d50}.suave{color:#55646a}
@media (max-width:767px){section{padding:48px 20px}.grade,.split,.duas{grid-template-columns:1fr!important}}</style>
</head>
<body>
<section>
  <h2>Do primeiro contato à primeira aula</h2>
  <div class="grade" style="position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px">
    <div style="position:absolute;top:9px;left:9px;right:calc(33.3% - 9px);height:2px;background:#2f5d50"></div>
    <div style="position:relative"><span style="display:block;width:20px;height:20px;border-radius:50%;background:#2f5d50"></span><h3 style="margin-top:16px">Você chama no WhatsApp</h3><p class="suave">E escolhe o horário.</p></div>
    <div style="position:relative"><span style="display:block;width:20px;height:20px;border-radius:50%;background:#2f5d50"></span><h3 style="margin-top:16px">Conversa sobre a sua dor</h3><p class="suave">Antes de qualquer exercício.</p></div>
    <div style="position:relative"><span style="display:block;width:20px;height:20px;border-radius:50%;background:#2f5d50"></span><h3 style="margin-top:16px">Faz a aula acompanhada</h3><p class="suave">Em turma de até 4 pessoas.</p></div>
  </div>
</section>
</body>
</html>
